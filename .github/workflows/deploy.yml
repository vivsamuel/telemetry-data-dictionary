name: Deploy Data Dictionary Apps to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            pilot-app/package-lock.json
            Datadictionary/package-lock.json

      - name: Install current app dependencies
        working-directory: ./pilot-app
        run: npm ci

      - name: Build current app
        working-directory: ./pilot-app
        run: npm run build

      - name: Install sample app dependencies
        working-directory: ./Datadictionary
        run: npm ci

      - name: Build sample app
        working-directory: ./Datadictionary
        run: npm run build -- --base /telemetry-data-dictionary/sample/

      - name: Add sample app to Pages artifact
        run: |
          mkdir -p pilot-app/dist/sample
          cp -R Datadictionary/dist/. pilot-app/dist/sample/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./pilot-app/dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
